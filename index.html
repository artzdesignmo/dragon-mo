<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dragon Mo — Pure Math Animation</title>
<meta name="description" content="16 animations created purely from mathematical formulas. Only sin and cos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Geist:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
body{font-family:Geist,"Noto Sans TC",system-ui,sans-serif;transition:background .3s}
body[data-bg="black"]{background:#0a0a0a;color:var(--ui-fg)}
body[data-bg="gray"]{background:#e6e6e6;color:#111}
body[data-bg="white"]{background:#ffffff;color:#111}
:root{}
body[data-bg="black"]{--ui-brd:rgba(255,255,255,.25);--ui-bg:rgba(10,10,10,.45);--ui-fg:#f5f5f5;--ui-dim:rgba(245,245,245,.6)}
body[data-bg="gray"]{--ui-brd:rgba(0,0,0,.2);--ui-bg:rgba(255,255,255,.55);--ui-fg:#111;--ui-dim:rgba(0,0,0,.55)}
body[data-bg="white"]{--ui-brd:rgba(0,0,0,.2);--ui-bg:rgba(255,255,255,.6);--ui-fg:#111;--ui-dim:rgba(0,0,0,.55)}
.display{font-family:"Dela Gothic One","Noto Sans TC",sans-serif}
#cv{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;cursor:crosshair}
.ui{position:fixed;z-index:10;color:var(--ui-fg)}
#topbar{top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:18px 22px;pointer-events:none}
#topbar>*{pointer-events:auto}
#topbar .display{font-size:15px;letter-spacing:.06em;opacity:.9}
.topbtns{display:flex;gap:8px}
.tbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--ui-brd);background:var(--ui-bg);backdrop-filter:blur(8px);color:var(--ui-fg);cursor:pointer;font-size:13px;font-weight:600}
.tbtn:hover{border-color:#fff}
#title{top:64px;left:22px;pointer-events:none}
#title h1{font-size:clamp(26px,4.5vw,44px);margin:0;letter-spacing:.02em;text-shadow:0 2px 20px rgba(0,0,0,.6)}
#title p{margin:6px 0 0;font-size:13px;color:var(--ui-dim)}
#modes{bottom:86px;left:0;right:0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 16px;max-height:32vh;overflow-y:auto}
.mode{padding:9px 18px;border-radius:999px;border:1px solid var(--ui-brd);background:var(--ui-bg);backdrop-filter:blur(8px);color:var(--ui-fg);cursor:pointer;font-size:13px;font-weight:600;transition:all .2s;white-space:nowrap}
.mode.active{background:#f5f5f5;color:#0a0a0a;border-color:var(--ui-fg)}
#controls{bottom:0;left:0;right:0;display:flex;gap:12px;align-items:center;justify-content:center;padding:16px;flex-wrap:wrap}
.cbtn{padding:9px 20px;border-radius:999px;border:1px solid var(--ui-brd);background:var(--ui-bg);backdrop-filter:blur(8px);color:var(--ui-fg);cursor:pointer;font-size:13px;font-weight:600}
input[type=text]{padding:9px 16px;border-radius:999px;border:1px solid var(--ui-brd);background:var(--ui-bg);backdrop-filter:blur(8px);color:var(--ui-fg);font-size:13px;width:160px;outline:none}
input[type=range]{accent-color:var(--ui-fg);width:110px}
.lbl{font-size:12px;color:var(--ui-dim)}
#formula{top:64px;right:22px;max-width:280px;padding:12px 16px;border:1px dashed var(--ui-brd);border-radius:12px;background:var(--ui-bg);backdrop-filter:blur(8px);font-family:ui-monospace,Menlo,monospace;font-size:11px;line-height:1.7;color:var(--ui-dim);white-space:pre-wrap;word-break:break-all;pointer-events:none}
#formula b{color:var(--ui-fg)}
#hideUI{position:fixed;z-index:11;bottom:16px;right:16px;width:38px;height:38px;border-radius:50%;border:1px solid var(--ui-brd);background:var(--ui-bg);backdrop-filter:blur(8px);color:var(--ui-fg);cursor:pointer;font-size:15px}
body.hideui .ui,body.hideui #hideUI,body.hideui #burger{display:none}
#burger{position:fixed;z-index:20;top:16px;right:16px;width:44px;height:44px;border-radius:12px;border:1px solid var(--ui-brd);background:var(--ui-bg);backdrop-filter:blur(8px);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
#burger span{display:block;width:20px;height:2px;background:var(--ui-fg);border-radius:2px;transition:all .25s}
body.menuopen #burger span:nth-child(1){transform:translateY(7px) rotate(45deg)}
body.menuopen #burger span:nth-child(2){opacity:0}
body.menuopen #burger span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
#panel{position:fixed;z-index:19;top:70px;right:16px;width:300px;max-height:calc(100vh - 90px);overflow-y:auto;border:1px solid var(--ui-brd);border-radius:16px;background:var(--ui-bg);backdrop-filter:blur(16px);padding:18px;display:none;color:var(--ui-fg)}
body.menuopen #panel{display:block}
body.hideui #panel{display:none!important}
#panel h3{margin:0 0 10px;font-size:12px;letter-spacing:.08em;color:var(--ui-dim);font-weight:600}
#panel .prow{display:flex;align-items:center;gap:10px;margin:10px 0;flex-wrap:wrap}
#panel .pmodes{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0 14px}
#panel .pmode{padding:8px 6px;border-radius:10px;border:1px solid var(--ui-brd);background:transparent;color:var(--ui-fg);cursor:pointer;font-size:12px;font-weight:600}
#panel .pmode.active{background:var(--ui-fg);color:var(--ui-bg);border-color:var(--ui-fg)}
#panel input[type=range]{flex:1;min-width:110px}
#panel input[type=text]{width:100%}
@media(max-width:700px){
 #formula{display:none}
 #title{top:58px;left:16px}
 #modes{bottom:78px;gap:6px}
 .mode{padding:7px 13px;font-size:12px}
}
</style>
</head>
<body data-bg="black">
<canvas id="cv"></canvas>
<div class="ui" id="topbar">
  <div class="display">OPENX · DRAGON MO</div>
</div>
<button id="burger" aria-label="menu"><span></span><span></span><span></span></button>
<div id="panel">
  <h3 data-i18n="modes">形態</h3>
  <div class="pmodes" id="pmodes"></div>
  <h3 data-i18n="controls">控制</h3>
  <div class="prow"><button class="cbtn" id="playBtn">⏸ <span data-i18n="pause">暫停</span></button></div>
  <div class="prow"><span class="lbl" data-i18n="speed">速度</span><input type="range" id="speed" min="1" max="30" value="8"></div>
  <div class="prow"><span class="lbl" data-i18n="trail">殘影</span><input type="range" id="trail" min="2" max="60" value="14"></div>
  <div class="prow"><span class="lbl" data-i18n="drift">移動</span><input type="range" id="drift" min="0" max="100" value="0"></div>
  <div class="prow"><input type="text" id="wordInput" maxlength="8" value="DRAGON" placeholder="Type word…" style="display:none"></div>
  <div class="prow">
    <button class="cbtn" id="bgBtn">● <span data-i18n="bg">底色</span></button>
    <button class="cbtn" id="langBtn">EN</button>
  </div>
</div>
<div class="ui" id="title">
  <h1 class="display" data-i18n="title">Dragon Mo</h1>
  <p data-i18n="sub">16 種純數學公式動畫 — 只用 sin 同 cos</p>
</div>
<div class="ui" id="formula"></div>
<button id="hideUI" title="隱藏 UI"><span class="h">👁</span><span style="display:none" class="s">👁‍🗨</span></button>
<script>
"use strict";
const STR={
 en:{title:"Dragon Mo",sub:"16 pure math-formula animations — only sin & cos",pause:"Pause",play:"Play",speed:"Speed",trail:"Trail",drift:"Drift",modes:"MODES",controls:"CONTROLS",bg:"BG"},
 zh:{title:"Dragon Mo",sub:"16 種純數學公式動畫 — 只用 sin 同 cos",pause:"暫停",play:"播放",speed:"速度",trail:"殘影",drift:"移動",modes:"形態",controls:"控制",bg:"底色"}
};
let lang=localStorage.getItem("dragonmo-lang")||"en";
function applyLang(){document.querySelectorAll("[data-i18n]").forEach(el=>{const k=el.dataset.i18n;if(STR[lang][k])el.textContent=STR[lang][k];});
 document.getElementById("langBtn").textContent=lang==="en"?"中":"EN";
 const pb=document.getElementById("playBtn").querySelector("span");if(pb)pb.textContent=playing?STR[lang].pause:STR[lang].play;
 refreshModeLabels();
 const m=MODES.find(x=>x.id===mode);if(m)formulaEl.innerHTML="<b>"+m.icon+" "+(lang==="en"?m.en:m.zh)+"</b>\n"+m.f;}
document.getElementById("langBtn").onclick=()=>{lang=lang==="en"?"zh":"en";localStorage.setItem("dragonmo-lang",lang);applyLang();};
const BGS=[["black","#0a0a0a","255,255,255","10,10,10"],["gray","#e6e6e6","20,20,20","230,230,230"],["white","#ffffff","20,20,20","255,255,255"]];
let bgI=+(localStorage.getItem("dragonmo-bg")||0);
function applyBg(){document.body.dataset.bg=BGS[bgI][0];ctx.fillStyle=BGS[bgI][1];ctx.fillRect(0,0,W,H);}
document.getElementById("bgBtn").onclick=()=>{bgI=(bgI+1)%3;localStorage.setItem("dragonmo-bg",bgI);applyBg();};
document.getElementById("hideUI").onclick=()=>document.body.classList.toggle("hideui");
document.getElementById("burger").onclick=()=>document.body.classList.toggle("menuopen");
// ================= math core — only sin & cos =================
const TAU=Math.PI*2,sin=Math.sin,cos=Math.cos;
let W=800,H=520,CX=W/2,CY=H/2,SC=1; // SC = scale factor for fullscreen
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
function resize(){
 W=window.innerWidth;H=window.innerHeight;CX=W/2;CY=H/2;
 SC=Math.min(W/800,H/520);
 cv.width=W;cv.height=H;
 applyBg();
}
window.addEventListener("resize",resize);
const MODES=[
 {id:"dragon",icon:"🐉",en:"Dragon",zh:"龍",f:"k=9·cos(x/8), e=y/8−12.5\nd=(k²+e²)/99+sin(t)/6+.5\nq=99−e·sin(atan2(k,e)·7)/d+k·(3+cos(d²−t)·2)",
  pt:(x,y,t)=>{const k=9*cos(x/8),e=y/8-12.5,d=(k*k+e*e)/99+sin(t)/6+.5,
   q=99-e*sin(Math.atan2(k,e)*7)/d+k*(3+cos(d*d-t)*2),c=d/2+e/69-t/16;
   return[CX+(-200+q*sin(c)*1.6)*SC,CY+(-160+(q+19*d)*cos(c)*1.1)*SC];},gen:(N,t)=>{const p=[];for(let i=0;i<N;i++)p.push([(i%200),(i/200)*2.2]);return p;}},
 {id:"fish",icon:"🐟",en:"Fish",zh:"魚",f:"u=i/N, wiggle=sin(7u−5t)·46u²\nwidth=58·sin(πu)·(1−.55u)",
  pt:(i,N,t)=>{const u=i/N,bx=(u-.5)*340,by=sin(u*7-t*5)*46*u*u,
   w=58*sin(Math.PI*Math.min(1,u*1.15))*(1-u*.55),s=i%2?1:-1;
   let px=bx,py=by+s*w;if(u>.8){const f2=(u-.8)/.2;py=by+s*w*(1-f2)+s*sin(t*5)*30*f2;px=bx+f2*70;}
   return[CX+px*SC,CY+py*.9*SC];}},
 {id:"flower",icon:"🌸",en:"Flower",zh:"花",f:"rhodonea: r=(cos(3θ+t/2.5)·.5+.5)·230·(1+.12·sin(1.5t))",
  pt:(i,N,t)=>{const th=i/N*TAU,b=1+.12*sin(t*1.5),r=(cos(3*th+t*.4)*.5+.5)*230*b+30,s=sin(t+th*3)*8;
   return[CX+(r+s)*cos(th+t*.15)*SC,CY+(r+s)*sin(th+t*.15)*SC];}},
 {id:"letters",icon:"🔤",en:"Letters",zh:"字母",f:"5×5 vector font bitmasks\npt → x+sin(2t)·10, y+cos(1.6t)·10",pt:null},
 {id:"butterfly",icon:"🦋",en:"Butterfly",zh:"蝴蝶",f:"wings: flap=sin(3t)·.4+.6\nwx=side·v·160·flap",
  pt:(i,N,t)=>{const u=i/N,s=u<.5?-1:1,v=u<.5?u*2:(u-.5)*2,flap=sin(t*3)*.4+.6;
   return[CX+s*v*160*flap*SC,CY+(sin(v*Math.PI)*100*(.5+.5*sin(t*3+v*3))-v*30-20)*SC];}},
 {id:"heart",icon:"💗",en:"Heart",zh:"心",f:"x=16·sin³θ, y=13cosθ−5cos2θ−2cos3θ−cos4θ\nbeat=1+.08·sin(2t)",
  pt:(i,N,t)=>{const th=i/N*TAU,b=1+.08*sin(t*2);
   return[CX+16*Math.pow(sin(th),3)*10*b*SC,CY+(-(13*cos(th)-5*cos(2*th)-2*cos(3*th)-cos(4*th))*10*b+30)*SC];}},
 {id:"spiral",icon:"🌀",en:"Spiral",zh:"螺旋",f:"θ=i/N·12π+t, r=θ·8",
  pt:(i,N,t)=>{const th=i/N*TAU*6+t,r=th*8;return[CX+r*cos(th)*SC,CY+r*sin(th)*SC];}},
 {id:"wave",icon:"🌊",en:"Wave",zh:"波浪",f:"y=sin(c·.15+3t)·40+cos(r·.2+2t)·30",
  pt:(i,N,t)=>{const C=140,c=i%C,r=(i/C)|0;
   return[CX+(c/C-.5)*700*SC,CY+((r/(N/C)-.5)*400+sin(c*.15+t*3)*40+cos(r*.2+t*2)*30)*SC];}},
 {id:"star",icon:"⭐",en:"Star",zh:"星",f:"5-point star, inner r morphs\nr=80+120·(sin(.8t)·.5+.5)",
  pt:(i,N,t)=>{const th=i/N*TAU,seg=TAU/10,k=Math.floor(th/seg),
   r=(k%2?80+120*(sin(t*.8)*.5+.5):200)*(1+.1*sin(t*3+th*5));
   return[CX+r*cos(th+t*.5)*SC,CY+r*sin(th+t*.5)*SC];}},
 {id:"galaxy",icon:"🌌",en:"Galaxy",zh:"銀河",f:"3 arms: θ=u·6π+arm·2π/3+.8t\nr=u·220",
  pt:(i,N,t)=>{const arm=i%3,u=((i/3)|0)/(N/3),th=u*TAU*3+arm*TAU/3+t*.8,r=u*220;
   const sp=sin(u*20+t)*15*(1-u);return[CX+(r+sp)*cos(th)*SC,CY+(r+sp)*sin(th)*.7*SC];}},
 {id:"knot",icon:"🪢",en:"Knot",zh:"繩結",f:"torus knot p=2,q=3\nx=(120+50cos(3θ+t))·cos2θ",
  pt:(i,N,t)=>{const th=i/N*TAU,x=(120+50*cos(3*th+t))*cos(2*th),y=(120+50*cos(3*th+t))*sin(2*th)*.8;
   return[CX+x*SC,CY+(y+sin(t+th*2)*10)*SC];}},
 {id:"feather",icon:"🪶",en:"Feather",zh:"羽毛",f:"shaft sway=sin(1.5t+4u)·20\nbarbs=sin(uπ)·80",
  pt:(i,N,t)=>{const u=i/N,s=i%2?1:-1,b=sin(u*Math.PI)*80;
   return[CX+((u-.5)*400+s*b*.7)*SC,CY+(sin(t*1.5+u*4)*20+u*50-s*b*.5+sin(t*2+u*10)*8-40)*SC];}},
 {id:"shell",icon:"🐚",en:"Shell",zh:"貝殼",f:"archimedean: r=12θ, θ=i/N·8π+.3t",
  pt:(i,N,t)=>{const th=i/N*TAU*4+t*.3,r=th*12,ch=1+.06*sin(12*th-t);
   return[CX+r*ch*cos(th)*SC,CY+r*ch*sin(th)*SC];}},
 {id:"bird",icon:"🐦",en:"Bird",zh:"飛鳥",f:"flap=sin(4t)·60, wings=side·v·150",
  pt:(i,N,t)=>{const u=i/N,s=u<.5?-1:1,v=u<.5?u*2:(u-.5)*2,flap=sin(t*4)*60;
   return[CX+s*v*150*SC,CY+(Math.abs(sin(v*Math.PI*2))*flap*(1-v*.3)-v*20-40+sin(t*2)*10)*SC];}},
 {id:"formulaA",icon:"🔮",en:"Formula A",zh:"公式 A",f:"k=(4+sin(2y−t)·3)·cos(x/29)\nq=3sin(2k)+.3/k+sin(y/25)·k·(9+4sin(9e−3d+2t))",
  pt:(i,N,t)=>{const x=i,y=i/235,k=(4+sin(y*2-t)*3)*cos(x/29),e=y/8-13,
   d=Math.hypot(k,e),c=d-t,q=3*sin(k*2)+.3/k+sin(y/25)*k*(9+4*sin(e*9-d*3+t*2));
   return[CX+(q+30*cos(c))*1.2*SC,CY+(q*sin(c)+d*39-220)*1.2*SC];}},
 {id:"formulaB",icon:"🌪️",en:"Formula B",zh:"公式 B",f:"k=(y<7?8+sin(y^9)·6:4+cos(y))·cos(i+t/2)\nq=yk/5·(2+sin(2d+y−4t))+80",
  pt:(i,N,t)=>{const y=i/790,k=(y<7?8+sin(y^9)*6:4+cos(y))*cos(i+t/2),e=y/2-13,
   d=Math.hypot(k,e),c=d/4-t/2+(i%2)*3,q=y*k/5*(2+sin(d*2+y-t*4))+80;
   return[CX+(q*cos(c)*cos(c/2+e/8))*1.6*SC,CY+(q*d/8*sin(c))*1.6*SC];}},
];
const FONT={A:[0x0E,0x11,0x1F,0x11,0x11],B:[0x1E,0x11,0x1E,0x11,0x1E],C:[0x0E,0x11,0x10,0x11,0x0E],D:[0x1E,0x11,0x11,0x11,0x1E],E:[0x1F,0x10,0x1E,0x10,0x1F],F:[0x1F,0x10,0x1E,0x10,0x10],G:[0x0E,0x11,0x19,0x11,0x0E],H:[0x11,0x11,0x1F,0x11,0x11],I:[0x0E,0x04,0x04,0x04,0x0E],J:[0x07,0x02,0x02,0x12,0x0C],K:[0x11,0x12,0x1C,0x12,0x11],L:[0x10,0x10,0x10,0x10,0x1F],M:[0x11,0x1B,0x15,0x11,0x11],N:[0x11,0x19,0x15,0x13,0x11],O:[0x0E,0x11,0x11,0x11,0x0E],P:[0x1E,0x11,0x1E,0x10,0x10],Q:[0x0E,0x11,0x11,0x13,0x0D],R:[0x1E,0x11,0x1E,0x12,0x11],S:[0x0F,0x10,0x0E,0x01,0x1E],T:[0x1F,0x04,0x04,0x04,0x04],U:[0x11,0x11,0x11,0x11,0x0E],V:[0x11,0x11,0x11,0x0A,0x04],W:[0x11,0x11,0x15,0x1B,0x11],X:[0x11,0x0A,0x04,0x0A,0x11],Y:[0x11,0x0A,0x04,0x04,0x04],Z:[0x1F,0x02,0x04,0x08,0x1F],' ':[0,0,0,0,0]};
function letterPts(word,t){const pts=[],s=30*SC,gap=12*SC,tw=word.length*(5*s+gap);let ox=CX-tw/2;
 [...word.toUpperCase()].forEach(ch=>{const g=FONT[ch]||FONT[' '];
  for(let r=0;r<5;r++)for(let c=0;c<5;c++)if(g[r]>>(4-c)&1)
   pts.push([ox+c*s+sin(t*2.4+r*.7+c*.4)*11*SC,CY-2.5*s+r*s+cos(t*1.8+c*.6+r*.3)*11*SC]);
  ox+=5*s+gap;});return pts;}
// ================= engine =================
const modesEl=document.getElementById("pmodes"),formulaEl=document.getElementById("formula");
let mode="dragon",playing=true,t=0,speed=8,trail=14,drift=0;
const N=20000;
MODES.forEach(m=>{const b=document.createElement("button");b.className="pmode"+(m.id===mode?" active":"");
 b.dataset.mode=m.id;b.innerHTML=m.icon+" "+(lang==="en"?m.en:m.zh);
 b.onclick=()=>{document.querySelectorAll(".pmode").forEach(x=>x.classList.remove("active"));b.classList.add("active");
  mode=m.id;document.getElementById("wordInput").style.display=mode==="letters"?"":"none";
  formulaEl.innerHTML="<b>"+m.icon+" "+(lang==="en"?m.en:m.zh)+"</b>\n"+m.f;};
 modesEl.appendChild(b);});
function refreshModeLabels(){document.querySelectorAll(".pmode").forEach(b=>{const m=MODES.find(x=>x.id===b.dataset.mode);
 b.innerHTML=m.icon+" "+(lang==="en"?m.en:m.zh);});}
document.getElementById("playBtn").onclick=()=>{playing=!playing;applyLang();};
document.getElementById("speed").oninput=e=>speed=+e.target.value;
document.getElementById("trail").oninput=e=>trail=+e.target.value;
document.getElementById("drift").oninput=e=>drift=+e.target.value;
formulaEl.innerHTML="<b>🐉 Dragon</b>\n"+MODES[0].f;
resize();applyBg();
let lastT=0;
// ---- pointer trajectory follow ----
let ptx=CX,pty=CY,pvx=0,pvy=0,pSeen=false,lx=null;
const PTR_TRAIL=[];
function updatePtr(e){
 const r=cv.getBoundingClientRect();
 const x=(e.clientX-r.left)/r.width*W, y=(e.clientY-r.top)/r.height*H;
 if(pSeen){pvx=pvx*.6+(x-ptx)*.4; pvy=pvy*.6+(y-pty)*.4;}
 ptx=x;pty=y;pSeen=true;
 PTR_TRAIL.unshift([x,y]);if(PTR_TRAIL.length>14)PTR_TRAIL.pop();
 if(lx!==null)t+=(x-lx)*.002; lx=x;
}
cv.addEventListener("pointerdown",e=>{updatePtr(e);});
cv.addEventListener("pointermove",updatePtr);
window.addEventListener("pointerup",()=>{lx=null;});
function attract(x,y){
 if(!pSeen)return[x,y];
 const R=230*SC,dx=ptx-x,dy=pty-y,d2=dx*dx+dy*dy;
 let nx=x,ny=y;
 if(d2<R*R){
  const d=Math.sqrt(d2)||1,f=1-d/R,ff=f*f;
  nx+=dx/d*ff*160*SC+pvx*ff*10;
  ny+=dy/d*ff*160*SC+pvy*ff*10;
 }
 for(let k=0;k<PTR_TRAIL.length;k+=2){
  const tp=PTR_TRAIL[k],tdx=tp[0]-nx,tdy=tp[1]-ny,td2=tdx*tdx+tdy*tdy,TR=90*SC;
  if(td2<TR*TR){
   const d=Math.sqrt(td2)||1,f=(1-d/TR)*.35*(1-k/PTR_TRAIL.length);
   nx+=tdx/d*f*60*SC;ny+=tdy/d*f*60*SC;
  }
 }
 return[nx,ny];
}
function frame(now){
 requestAnimationFrame(frame);
 const dt=Math.min(.05,(now-lastT)/1000||.016);lastT=now;
 if(!playing)return;
 t+=dt*speed*.55;
 // 自動移動：drift 0=唔郁，越大越快隨機漂
 const dox=drift>0?(sin(t*.23)+sin(t*.11+1.7)*.6)*drift*2.2:0;
 const doy=drift>0?(cos(t*.19+.5)+sin(t*.07+3.1)*.6)*drift*2.2:0;
 ctx.fillStyle=`rgba(${BGS[bgI][3]},${trail/100})`;ctx.fillRect(0,0,W,H); // v6 letters 式殘影
 const gs=2.4*SC, pc=BGS[bgI][2];
 ctx.fillStyle=`rgba(${pc},.92)`; // 全統一 letters 顆粒
 if(mode==="letters"){
  for(const[x0,y0]of letterPts((document.getElementById("wordInput").value||"DRAGON").slice(0,8),t)){
   const[x,y]=attract(x0,y0);ctx.fillRect(x+dox,y+doy,gs,gs);}
  pvx*=.94;pvy*=.94;return;
 }
 const M=MODES.find(m=>m.id===mode);
 const pts=M.gen?M.gen(N,t):null;
 for(let i=0;i<N;i++){
  let x,y;
  if(M.gen){[x,y]=M.pt(pts[i][0],pts[i][1],t);}
  else[x,y]=M.pt(i,N,t);
  [x,y]=attract(x,y);
  ctx.fillRect(x+dox,y+doy,gs,gs);
 }
 pvx*=.94;pvy*=.94;
}
applyLang();requestAnimationFrame(frame);
</script>
