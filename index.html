<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dragon Mo — Pure Math Animation</title>
<meta name="description" content="14 animations created purely from mathematical formulas. Only sin and cos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Geist:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6e6e6;--ink:#111;--muted:#8a867e;--line:rgba(0,0,0,.14);--card:#fff}
html[data-theme="white"]{--bg:#fff;--ink:#111;--muted:#8a867e;--line:rgba(0,0,0,.14);--card:#fff}
html[data-theme="black"]{--bg:#111;--ink:#f5f5f5;--muted:#8a867e;--line:rgba(255,255,255,.16);--card:#1a1a1a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:Geist,"Noto Sans TC",system-ui,sans-serif;transition:background .3s,color .3s}
.display{font-family:"Dela Gothic One","Noto Sans TC",sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:28px 20px 60px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
h1{font-size:clamp(28px,6vw,52px);margin:0;letter-spacing:.02em}
.sub{color:var(--muted);font-size:14px;margin:6px 0 20px}
.topbtns{display:flex;gap:8px}
.tbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;font-size:13px;font-weight:600}
.tbtn:hover{border-color:var(--ink)}
.modes{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.mode{padding:9px 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:13px;font-weight:600;transition:all .2s}
.mode.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stage{position:relative;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#0a0a0a}
canvas{display:block;width:100%;height:auto;touch-action:none}
.formula{margin-top:14px;padding:14px 18px;border:1px dashed var(--line);border-radius:12px;font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.7;color:var(--muted);white-space:pre-wrap;word-break:break-all}
.formula b{color:var(--ink)}
.controls{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.cbtn{padding:9px 20px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:13px;font-weight:600}
input[type=text]{padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13px;width:180px;outline:none}
input[type=range]{accent-color:var(--ink)}
.lbl{font-size:12px;color:var(--muted)}
footer{margin-top:36px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
footer a{color:inherit}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="display" style="font-size:15px">OPENX</div>
    <div class="topbtns">
      <button class="tbtn" id="langBtn" title="語言">EN</button>
      <button class="tbtn" id="themeBtn" title="主題">◐</button>
    </div>
  </header>
  <h1 class="display" data-i18n="title">Dragon Mo</h1>
  <p class="sub" data-i18n="sub">16 種純數學公式動畫 — 只用 sin 同 cos</p>
  <div class="modes" id="modes"></div>
  <div class="stage"><canvas id="cv" width="800" height="520"></canvas></div>
  <div class="formula" id="formula"></div>
  <div class="controls">
    <button class="cbtn" id="playBtn">⏸ <span data-i18n="pause">暫停</span></button>
    <span class="lbl" data-i18n="speed">速度</span>
    <input type="range" id="speed" min="1" max="60" value="22" style="width:120px">
    <span class="lbl" data-i18n="trail">殘影</span>
    <input type="range" id="trail" min="2" max="60" value="14" style="width:120px">
    <input type="text" id="wordInput" maxlength="8" value="DRAGON" placeholder="Type word…" style="display:none">
  </div>
  <footer>
    <span>artzdesignmo / dragon-mo — MIT</span>
    <span><a href="https://openx-mo.vercel.app">openx-mo</a> · <a href="https://github.com/artzdesignmo/dragon-mo">GitHub</a></span>
  </footer>
</div>
<script>
"use strict";
const STR={
 en:{title:"Dragon Mo",sub:"16 pure math-formula animations — only sin & cos",
  pause:"Pause",play:"Play",speed:"Speed",trail:"Trail"},
 zh:{title:"Dragon Mo",sub:"16 種純數學公式動畫 — 只用 sin 同 cos",
  pause:"暫停",play:"播放",speed:"速度",trail:"殘影"}
};
let lang=localStorage.getItem("dragonmo-lang")||"en";
function applyLang(){document.querySelectorAll("[data-i18n]").forEach(el=>{const k=el.dataset.i18n;if(STR[lang][k])el.textContent=STR[lang][k];});
 document.getElementById("langBtn").textContent=lang==="en"?"中":"EN";
 const pb=document.getElementById("playBtn").querySelector("span");if(pb)pb.textContent=playing?STR[lang].pause:STR[lang].play;}
let theme=localStorage.getItem("dragonmo-theme")||"light";
function applyTheme(){document.documentElement.dataset.theme=theme;}
document.getElementById("themeBtn").onclick=()=>{theme=theme==="light"?"white":theme==="white"?"black":"light";localStorage.setItem("dragonmo-theme",theme);applyTheme();};
document.getElementById("langBtn").onclick=()=>{lang=lang==="en"?"zh":"en";localStorage.setItem("dragonmo-lang",lang);applyLang();};
// ================= math core — only sin & cos =================
const TAU=Math.PI*2,sin=Math.sin,cos=Math.cos,W=800,H=520,CX=W/2,CY=H/2;
const MODES=[
 // 1 龍
 {id:"dragon",icon:"🐉",en:"Dragon",zh:"龍",f:"k=9·cos(x/8), e=y/8−12.5\nd=(k²+e²)/99+sin(t)/6+.5\nq=99−e·sin(atan2(k,e)·7)/d+k·(3+cos(d²−t)·2)\n→ q·sin(d/2+e/69−t/16), (q+19d)·cos(…)",
  pt:(x,y,t)=>{const k=9*cos(x/8),e=y/8-12.5,d=(k*k+e*e)/99+sin(t)/6+.5,
   q=99-e*sin(Math.atan2(k,e)*7)/d+k*(3+cos(d*d-t)*2),c=d/2+e/69-t/16;
   return[CX-200+q*sin(c)*1.6,CY-160+(q+19*d)*cos(c)*1.1];},gen:(N,t)=>{const p=[];for(let i=0;i<N;i++)p.push([(i%200),(i/200)*2.2]);return p;}},
 // 2 魚
 {id:"fish",icon:"🐟",en:"Fish",zh:"魚",f:"u=i/N, wiggle=sin(7u−5t)·46u²\nwidth=58·sin(πu)·(1−.55u)",
  pt:(i,N,t)=>{const u=i/N,bx=(u-.5)*340,by=sin(u*7-t*5)*46*u*u,
   w=58*sin(Math.PI*Math.min(1,u*1.15))*(1-u*.55),s=i%2?1:-1;
   let px=bx,py=by+s*w;if(u>.8){const f2=(u-.8)/.2;py=by+s*w*(1-f2)+s*sin(t*5)*30*f2;px=bx+f2*70;}
   return[CX+px,CY+py*.9];}},
 // 3 花
 {id:"flower",icon:"🌸",en:"Flower",zh:"花",f:"rhodonea: r=(cos(3θ+t/2.5)·.5+.5)·230·(1+.12·sin(1.5t))",
  pt:(i,N,t)=>{const th=i/N*TAU,b=1+.12*sin(t*1.5),r=(cos(3*th+t*.4)*.5+.5)*230*b+30,s=sin(t+th*3)*8;
   return[CX+(r+s)*cos(th+t*.15),CY+(r+s)*sin(th+t*.15)];}},
 // 4 字母
 {id:"letters",icon:"🔤",en:"Letters",zh:"字母",f:"5×5 vector font bitmasks\npt → x+sin(2t)·10, y+cos(1.6t)·10",
  pt:null},
 // 5 蝴蝶
 {id:"butterfly",icon:"🦋",en:"Butterfly",zh:"蝴蝶",f:"wings: flap=sin(3t)·.4+.6\nwx=side·v·160·flap, wy=sin(vπ)·100·(…)",
  pt:(i,N,t)=>{const u=i/N,s=u<.5?-1:1,v=u<.5?u*2:(u-.5)*2,flap=sin(t*3)*.4+.6;
   return[CX+s*v*160*flap,CY+sin(v*Math.PI)*100*(.5+.5*sin(t*3+v*3))-v*30-20];}},
 // 6 心
 {id:"heart",icon:"💗",en:"Heart",zh:"心",f:"x=16·sin³θ, y=13cosθ−5cos2θ−2cos3θ−cos4θ\nbeat=1+.08·sin(2t)",
  pt:(i,N,t)=>{const th=i/N*TAU,b=1+.08*sin(t*2);
   return[CX+16*Math.pow(sin(th),3)*10*b,CY-(13*cos(th)-5*cos(2*th)-2*cos(3*th)-cos(4*th))*10*b+30];}},
 // 7 螺旋
 {id:"spiral",icon:"🌀",en:"Spiral",zh:"螺旋",f:"θ=i/N·12π+t, r=θ·8\n→ r·(cosθ, sinθ)",
  pt:(i,N,t)=>{const th=i/N*TAU*6+t,r=th*8;return[CX+r*cos(th),CY+r*sin(th)];}},
 // 8 波
 {id:"wave",icon:"🌊",en:"Wave",zh:"波浪",f:"y=sin(c·.15+3t)·40+cos(r·.2+2t)·30\ninterfering sine field",
  pt:(i,N,t)=>{const C=140,c=i%C,r=(i/C)|0;
   return[CX+(c/C-.5)*700,CY+(r/(N/C)-.5)*400+sin(c*.15+t*3)*40+cos(r*.2+t*2)*30];}},
 // 9 星
 {id:"star",icon:"⭐",en:"Star",zh:"星",f:"5-point star, inner r morphs\nr=80+120·(sin(.8t)·.5+.5)",
  pt:(i,N,t)=>{const th=i/N*TAU,seg=TAU/10,k=Math.floor(th/seg),
   r=(k%2?80+120*(sin(t*.8)*.5+.5):200)*(1+.1*sin(t*3+th*5));
   return[CX+r*cos(th+t*.5),CY+r*sin(th+t*.5)];}},
 //10 銀河
 {id:"galaxy",icon:"🌌",en:"Galaxy",zh:"銀河",f:"3 arms: θ=u·6π+arm·2π/3+.8t\nr=u·220, spread=sin(20u+t)·15(1−u)",
  pt:(i,N,t)=>{const arm=i%3,u=((i/3)|0)/(N/3),th=u*TAU*3+arm*TAU/3+t*.8,r=u*220;
   const sp=sin(u*20+t)*15*(1-u);return[CX+(r+sp)*cos(th),CY+(r+sp)*sin(th)*.7];}},
 //11 繩結
 {id:"knot",icon:"🪢",en:"Knot",zh:"繩結",f:"torus knot p=2,q=3\nx=(120+50cos(3θ+t))·cos2θ",
  pt:(i,N,t)=>{const th=i/N*TAU,x=(120+50*cos(3*th+t))*cos(2*th),y=(120+50*cos(3*th+t))*sin(2*th)*.8;
   return[CX+x,CY+y+sin(t+th*2)*10];}},
 //12 羽毛
 {id:"feather",icon:"🪶",en:"Feather",zh:"羽毛",f:"shaft sway=sin(1.5t+4u)·20\nbarbs=sin(uπ)·80, flutter=sin(2t+10u)·8",
  pt:(i,N,t)=>{const u=i/N,s=i%2?1:-1,b=sin(u*Math.PI)*80;
   return[CX+(u-.5)*400+s*b*.7,CY+sin(t*1.5+u*4)*20+u*50-s*b*.5+sin(t*2+u*10)*8-40];}},
 //13 貝殼
 {id:"shell",icon:"🐚",en:"Shell",zh:"貝殼",f:"archimedean: r=12θ, θ=i/N·8π+.3t\nchambers=sin(12θ−t)·…",
  pt:(i,N,t)=>{const th=i/N*TAU*4+t*.3,r=th*12,ch=1+.06*sin(12*th-t);
   return[CX+r*ch*cos(th),CY+r*ch*sin(th)];}},
 //14 鳥
 {id:"bird",icon:"🐦",en:"Bird",zh:"飛鳥",f:"flap=sin(4t)·60, wings=side·v·150\nwy=|sin(2πv)|·flap·(1−.3v)",
  pt:(i,N,t)=>{const u=i/N,s=u<.5?-1:1,v=u<.5?u*2:(u-.5)*2,flap=sin(t*4)*60;
   return[CX+s*v*150,CY+Math.abs(sin(v*Math.PI*2))*flap*(1-v*.3)-v*20-40+sin(t*2)*10];}},
 //15 公式 A (user source)
 {id:"formulaA",icon:"🔮",en:"Formula A",zh:"公式 A",f:"k=(4+sin(2y−t)·3)·cos(x/29), e=y/8−13\nd=hypot(k,e), c=d−t\nq=3sin(2k)+.3/k+sin(y/25)·k·(9+4sin(9e−3d+2t))",
  pt:(i,N,t)=>{const x=i,y=i/235,k=(4+sin(y*2-t)*3)*cos(x/29),e=y/8-13,
   d=Math.hypot(k,e),c=d-t,q=3*sin(k*2)+.3/k+sin(y/25)*k*(9+4*sin(e*9-d*3+t*2));
   return[CX+(q+30*cos(c))*1.2,CY+(q*sin(c)+d*39-220)*1.2];}},
 //16 公式 B (user source)
 {id:"formulaB",icon:"🌪️",en:"Formula B",zh:"公式 B",f:"k=(y<7?8+sin(y^9)·6:4+cos(y))·cos(i+t/2)\nd=hypot(k,e), c=d/4−t/2+(i%2)·3\nq=yk/5·(2+sin(2d+y−4t))+80",
  pt:(i,N,t)=>{const y=i/790,k=(y<7?8+sin(y^9)*6:4+cos(y))*cos(i+t/2),e=y/2-13,
   d=Math.hypot(k,e),c=d/4-t/2+(i%2)*3,q=y*k/5*(2+sin(d*2+y-t*4))+80;
   return[CX+(q*cos(c)*cos(c/2+e/8))*1.6,CY+(q*d/8*sin(c))*1.6];}},
];
const FONT={A:[0x0E,0x11,0x1F,0x11,0x11],B:[0x1E,0x11,0x1E,0x11,0x1E],C:[0x0E,0x11,0x10,0x11,0x0E],D:[0x1E,0x11,0x11,0x11,0x1E],E:[0x1F,0x10,0x1E,0x10,0x1F],F:[0x1F,0x10,0x1E,0x10,0x10],G:[0x0E,0x11,0x19,0x11,0x0E],H:[0x11,0x11,0x1F,0x11,0x11],I:[0x0E,0x04,0x04,0x04,0x0E],J:[0x07,0x02,0x02,0x12,0x0C],K:[0x11,0x12,0x1C,0x12,0x11],L:[0x10,0x10,0x10,0x10,0x1F],M:[0x11,0x1B,0x15,0x11,0x11],N:[0x11,0x19,0x15,0x13,0x11],O:[0x0E,0x11,0x11,0x11,0x0E],P:[0x1E,0x11,0x1E,0x10,0x10],Q:[0x0E,0x11,0x11,0x13,0x0D],R:[0x1E,0x11,0x1E,0x12,0x11],S:[0x0F,0x10,0x0E,0x01,0x1E],T:[0x1F,0x04,0x04,0x04,0x04],U:[0x11,0x11,0x11,0x11,0x0E],V:[0x11,0x11,0x11,0x0A,0x04],W:[0x11,0x11,0x15,0x1B,0x11],X:[0x11,0x0A,0x04,0x0A,0x11],Y:[0x11,0x0A,0x04,0x04,0x04],Z:[0x1F,0x02,0x04,0x08,0x1F],' ':[0,0,0,0,0]};
function letterPts(word,t){const pts=[],s=30,gap=12,tw=word.length*(5*s+gap);let ox=CX-tw/2;
 [...word.toUpperCase()].forEach(ch=>{const g=FONT[ch]||FONT[' '];
  for(let r=0;r<5;r++)for(let c=0;c<5;c++)if(g[r]>>(4-c)&1)
   pts.push([ox+c*s+sin(t*2.4+r*.7+c*.4)*11,CY-2.5*s+r*s+cos(t*1.8+c*.6+r*.3)*11]);
  ox+=5*s+gap;});return pts;}
// ================= engine =================
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
const modesEl=document.getElementById("modes"),formulaEl=document.getElementById("formula");
let mode="dragon",playing=true,t=0,speed=22,trail=14;
const N=20000; // denser
MODES.forEach(m=>{const b=document.createElement("button");b.className="mode"+(m.id===mode?" active":"");
 b.dataset.mode=m.id;b.innerHTML=m.icon+" <span>"+(lang==="en"?m.en:m.zh)+"</span>";
 b.onclick=()=>{document.querySelectorAll(".mode").forEach(x=>x.classList.remove("active"));b.classList.add("active");
  mode=m.id;document.getElementById("wordInput").style.display=mode==="letters"?"":"none";
  formulaEl.innerHTML="<b>"+m.icon+" "+(lang==="en"?m.en:m.zh)+"</b>\n"+m.f;};
 modesEl.appendChild(b);});
function refreshModeLabels(){document.querySelectorAll(".mode").forEach(b=>{const m=MODES.find(x=>x.id===b.dataset.mode);
 b.querySelector("span").textContent=lang==="en"?m.en:m.zh;});}
const _applyLang=applyLang;
applyLang=function(){_applyLang();refreshModeLabels();
 const m=MODES.find(x=>x.id===mode);formulaEl.innerHTML="<b>"+m.icon+" "+(lang==="en"?m.en:m.zh)+"</b>\n"+m.f;};
document.getElementById("playBtn").onclick=()=>{playing=!playing;applyLang();};
document.getElementById("speed").oninput=e=>speed=+e.target.value;
document.getElementById("trail").oninput=e=>trail=+e.target.value;
formulaEl.innerHTML="<b>🐉 Dragon</b>\n"+MODES[0].f;
ctx.fillStyle="#0a0a0a";ctx.fillRect(0,0,W,H);
let lastT=0;
function frame(now){
 requestAnimationFrame(frame);
 const dt=Math.min(.05,(now-lastT)/1000||.016);lastT=now;
 if(!playing)return;
 t+=dt*speed*.55; // smooth time-based, faster
 ctx.fillStyle=`rgba(10,10,10,${trail/100})`;ctx.fillRect(0,0,W,H);
 if(mode==="letters"){
  ctx.fillStyle="rgba(255,255,255,.9)";
  for(const[x0,y0]of letterPts((document.getElementById("wordInput").value||"DRAGON").slice(0,8),t)){
   const[x,y]=attract(x0,y0);ctx.fillRect(x,y,2.4,2.4);}
  pvx*=.94;pvy*=.94;
  return;
 }
 const M=MODES.find(m=>m.id===mode);
 const pts=M.gen?M.gen(N,t):null;
 for(let i=0;i<N;i++){
  let x,y;
  if(M.gen){[x,y]=M.pt(pts[i][0],pts[i][1],t);}
  else[x,y]=M.pt(i,N,t);
  [x,y]=attract(x,y);
  const h=(sin(t*2+i*.0008)*.5+.5)*360;
  ctx.fillStyle=`hsla(${h},85%,66%,.85)`;
  const s=mode==="dragon"?2:2.2;
  ctx.fillRect(x,y,s,s);
 }
 pvx*=.94;pvy*=.94;
}
applyTheme();applyLang();requestAnimationFrame(frame);
// ---- pointer trajectory follow ----
let ptx=CX,pty=CY,pvx=0,pvy=0,pSeen=false,lx=null;
function updatePtr(e){
 const r=cv.getBoundingClientRect();
 const x=(e.clientX-r.left)/r.width*W, y=(e.clientY-r.top)/r.height*H;
 if(pSeen){pvx=pvx*.65+(x-ptx)*.35; pvy=pvy*.65+(y-pty)*.35;}
 ptx=x;pty=y;pSeen=true;
 if(lx!==null)t+=(x-lx)*.002; lx=x;
}
cv.addEventListener("pointerdown",e=>{updatePtr(e);cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);});
cv.addEventListener("pointermove",updatePtr);
window.addEventListener("pointerup",()=>{lx=null;});
// 每粒粒子受 pointer 牽引：跟住手指軌跡
function attract(x,y){
 if(!pSeen)return[x,y];
 const R=150,dx=ptx-x,dy=pty-y,d2=dx*dx+dy*dy;
 if(d2>R*R)return[x,y];
 const d=Math.sqrt(d2)||1,f=1-d/R;
 return[x+dx/d*f*70+pvx*f*4, y+dy/d*f*70+pvy*f*4];
}
</script>
</body>
</html>
